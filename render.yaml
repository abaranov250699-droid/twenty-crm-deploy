services:
  # 1. Основной веб-сервер Twenty CRM (Frontend + API Backend)
  - type: web
    name: twenty-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # Рекомендуется Starter (1GB RAM) во избежание OOM при сборке миграций
    region: frankfurt # Рекомендуется выбирать тот же регион, что и база Neon (например, Frankfurt)
    healthCheckPath: /healthz
    envVars:
      - key: NODE_PORT
        value: 3000
      - key: PORT
        value: 3000
      - key: SERVER_URL
        sync: false # Ваш публичный адрес Render, например: https://twenty-server.onrender.com
      - key: PG_DATABASE_URL
        sync: false # Строка подключения Neon Direct (postgresql://...)
      - key: REDIS_URL
        sync: false # Строка подключения Redis (Upstash или Render Redis)
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: STORAGE_TYPE
        value: local
      - key: DISABLE_DB_MIGRATIONS
        value: "false"
      - key: DISABLE_CRON_JOBS_REGISTRATION
        value: "false"

  # 2. Фоновый воркер (BullMQ фоновые задачи, синхронизация, рассылки)
  - type: worker
    name: twenty-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: yarn worker:prod
    plan: starter
    region: frankfurt
    envVars:
      - key: SERVER_URL
        fromService:
          type: web
          name: twenty-server
          property: host
      - key: PG_DATABASE_URL
        sync: false # Та же строка подключения Neon Direct
      - key: REDIS_URL
        sync: false # Тот же Redis
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: twenty-server
          property: envVar:ENCRYPTION_KEY
      - key: APP_SECRET
        fromService:
          type: web
          name: twenty-server
          property: envVar:APP_SECRET
      - key: DISABLE_DB_MIGRATIONS
        value: "true"
      - key: DISABLE_CRON_JOBS_REGISTRATION
        value: "true"
      - key: STORAGE_TYPE
        value: local
