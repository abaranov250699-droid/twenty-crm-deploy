services:
  # Основной сервис Twenty CRM (Web + API + Встроенный фоновый воркер)
  - type: web
    name: twenty-crm
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # Рекомендуется тариф Starter (1GB RAM) для стабильной работы миграций
    region: frankfurt # Регион совпадает с Neon (eu-central-1) для минимального пинга
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_PORT
        value: 3000
      - key: SERVER_URL
        sync: false # Ваш URL на Render (например: https://twenty-crm-xxxx.onrender.com)
      - key: PG_DATABASE_URL
        sync: false # Строка подключения Neon (Direct connection)
      - key: REDIS_URL
        sync: false # Строка подключения Redis (Upstash или Render)
      - key: ENCRYPTION_KEY
        generateValue: true # Render сгенерирует криптографический ключ автоматически
      - key: APP_SECRET
        generateValue: true # Render сгенерирует секрет автоматически
      - key: STORAGE_TYPE
        value: local
      - key: ENABLE_COMBINED_WORKER
        value: "true" # Запускает BullMQ воркер внутри контейнера (экономит ресурсы)
      - key: DISABLE_DB_MIGRATIONS
        value: "false"
      - key: DISABLE_CRON_JOBS_REGISTRATION
        value: "false"
